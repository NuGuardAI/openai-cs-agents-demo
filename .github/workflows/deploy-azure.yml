name: Deploy to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      chatkit_domain_key:
        description: Public ChatKit domain key for the Azure frontend hostname
        required: false
        type: string

env:
  AZURE_WEBAPP_NAME: openai-cs-agents-backend
  AZURE_WEBAPP_PACKAGE_PATH: './python-backend'
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  RESOURCE_GROUP: openai-cs-agents-demo-rg
  LOCATION: eastus
  APP_SERVICE_PLAN: openai-cs-agents-plan
  APP_SERVICE_SKU: ${{ vars.AZURE_APP_SERVICE_SKU || 'P1V3' }}
  APP_SERVICE_INSTANCES: ${{ vars.AZURE_APP_SERVICE_INSTANCES || '3' }}
  STATIC_WEB_APP_NAME: openai-cs-agents-frontend
  AZURE_OPENAI_MODEL_NAME: gpt-5.4-nano

jobs:
  build-and-deploy-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ./python-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group (if not exists)
        run: |
          az group create --name ${{ env.RESOURCE_GROUP }} --location ${{ env.LOCATION }}

      - name: Create or resize App Service Plan
        run: |
          if az appservice plan show \
            --name "$APP_SERVICE_PLAN" \
            --resource-group "$RESOURCE_GROUP" --output none 2>/dev/null; then
            az appservice plan update \
              --name "$APP_SERVICE_PLAN" \
              --resource-group "$RESOURCE_GROUP" \
              --sku "$APP_SERVICE_SKU" \
              --number-of-workers "$APP_SERVICE_INSTANCES"
          else
            az appservice plan create \
              --name "$APP_SERVICE_PLAN" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --sku "$APP_SERVICE_SKU" \
              --number-of-workers "$APP_SERVICE_INSTANCES" \
              --is-linux
          fi

      - name: Create Web App
        run: |
          if ! az webapp show \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" --output none 2>/dev/null; then
            az webapp create \
              --name "$AZURE_WEBAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --plan "$APP_SERVICE_PLAN" \
              --runtime "PYTHON:$PYTHON_VERSION"
          fi

      - name: Enable session affinity
        run: |
          az webapp update \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --client-affinity-enabled true

      - name: Configure App Settings
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --settings \
              AZURE_OPENAI_KEY="${{ secrets.AZURE_OPENAI_KEY }}" \
              AZURE_OPENAI_ENDPOINT="${{ vars.AZURE_OPENAI_ENDPOINT }}" \
              AZURE_OPENAI_MODEL_NAME="${{ env.AZURE_OPENAI_MODEL_NAME }}" \
              SCM_DO_BUILD_DURING_DEPLOYMENT=true \
              WEBSITES_PORT=8000

      # ChatKit threads, streaming state, and login tokens are held in memory.
      # Keep one worker per instance; ARR affinity pins each browser to an instance.
      - name: Configure startup command
        run: |
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --always-on true \
            --generic-configurations '{"healthCheckPath":"/health"}' \
            --startup-file "gunicorn -w 1 -k uvicorn.workers.UvicornWorker api:app --bind 0.0.0.0:8000"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Output Backend URL
        id: backend-url
        run: |
          BACKEND_URL="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "Backend deployed to: $BACKEND_URL"

    outputs:
      backend_url: ${{ steps.backend-url.outputs.BACKEND_URL }}

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-backend
    
    steps:
      - name: Validate ChatKit domain key
        env:
          CHATKIT_DOMAIN_KEY: ${{ inputs.chatkit_domain_key || vars.NEXT_PUBLIC_CHATKIT_DOMAIN_KEY }}
        run: |
          if [ -z "$CHATKIT_DOMAIN_KEY" ]; then
            echo "::error::Set repository variable NEXT_PUBLIC_CHATKIT_DOMAIN_KEY or pass chatkit_domain_key on a manual run for the Azure frontend hostname."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        working-directory: ./ui
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: ./ui
        run: pnpm run build
        env:
          NEXT_PUBLIC_API_BASE: ${{ needs.build-and-deploy-backend.outputs.backend_url }}
          NEXT_PUBLIC_CHATKIT_DOMAIN_KEY: ${{ inputs.chatkit_domain_key || vars.NEXT_PUBLIC_CHATKIT_DOMAIN_KEY }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Static Web App (if not exists)
        run: |
          az staticwebapp create \
            --name ${{ env.STATIC_WEB_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.LOCATION }} \
            --sku Free || true

      - name: Get Static Web App deployment token
        id: swa-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name ${{ env.STATIC_WEB_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "DEPLOYMENT_TOKEN=$TOKEN" >> $GITHUB_OUTPUT

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.DEPLOYMENT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./ui/out"
          output_location: ""
          skip_app_build: true

      - name: Output Frontend URL
        run: |
          FRONTEND_URL=$(az staticwebapp show \
            --name ${{ env.STATIC_WEB_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "defaultHostname" -o tsv)
          echo "Frontend deployed to: https://$FRONTEND_URL"

  configure-cors:
    runs-on: ubuntu-latest
    needs: [build-and-deploy-backend, build-and-deploy-frontend]
    
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get Static Web App URL
        id: frontend-url
        run: |
          FRONTEND_URL=$(az staticwebapp show \
            --name ${{ env.STATIC_WEB_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "defaultHostname" -o tsv)
          echo "FRONTEND_URL=https://$FRONTEND_URL" >> $GITHUB_OUTPUT

      - name: Configure CORS on Backend
        run: |
          FRONTEND_URL="${{ steps.frontend-url.outputs.FRONTEND_URL }}"
          # Pass ALLOWED_ORIGINS to FastAPI's CORSMiddleware via app setting.
          # Do NOT use `az webapp cors add` together with FastAPI's own CORSMiddleware —
          # both would add Access-Control-Allow-Origin headers, causing duplicate-header
          # rejections in browsers.  FastAPI's middleware is the single source of truth.
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --settings ALLOWED_ORIGINS="$FRONTEND_URL,http://localhost:3250,http://localhost:3000"
          # Clear any previously-added Azure-level CORS origins to avoid conflicts.
          # App-level FastAPI CORS is the only source of truth.
          EXISTING_ORIGINS=$(az webapp cors show \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "allowedOrigins[]" -o tsv || true)
          for origin in $EXISTING_ORIGINS; do
            az webapp cors remove \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --allowed-origins "$origin" || true
          done

      - name: Summary
        run: |
          echo "=== Deployment Complete ==="
          echo "Backend URL: ${{ needs.build-and-deploy-backend.outputs.backend_url }}"
          echo "Frontend URL: ${{ steps.frontend-url.outputs.FRONTEND_URL }}"
